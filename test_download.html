<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载功能测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }
        .error {
            color: #dc3545;
        }
        .success {
            color: #28a745;
        }
        .info {
            color: #17a2b8;
        }
        .warning {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 下载功能测试</h1>

        <div class="input-group">
            <input type="text" id="videoUrl"
                   value="https://www.bilibili.com/video/BV1jUgA6YEw6/?spm_id_from=333.1387.upload.video_card.click&vd_source=c560d6ba0469a144a9cdcc0bfd06c011"
                   placeholder="输入视频URL">
            <button onclick="parseVideo()">解析视频</button>
        </div>

        <div id="formatSelect" style="display: none;">
            <h3>选择格式</h3>
            <select id="formatSelect" style="width: 100%; padding: 10px; margin-bottom: 10px;">
                <option value="">请选择格式...</option>
            </select>
            <button id="downloadBtn" onclick="downloadVideo()">下载视频</button>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script>
        let videoData = null;

        function log(message, type = 'info') {
            const status = document.getElementById('status');
            const timestamp = new Date().toLocaleTimeString();
            status.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            status.scrollTop = status.scrollHeight;
        }

        async function parseVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            if (!url) {
                log('请输入视频URL', 'error');
                return;
            }

            log('开始解析视频...', 'info');
            document.getElementById('formatSelect').style.display = 'none';

            try {
                log('发送请求到: /api/parse', 'info');

                const response = await fetch('/api/parse', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url })
                });

                log(`响应状态: ${response.status}`, 'info');

                if (!response.ok) {
                    const errorText = await response.text();
                    log(`HTTP错误: ${response.status} - ${errorText}`, 'error');
                    return;
                }

                const result = await response.json();
                log('API响应成功', 'success');

                if (result.success) {
                    videoData = result.data;
                    log(`解析成功！标题: ${videoData.title}`, 'success');
                    log(`平台: ${videoData.platform}`, 'info');
                    log(`时长: ${videoData.duration_string}`, 'info');
                    log(`格式数量: ${videoData.formats.length}`, 'info');

                    populateFormatSelect();
                    document.getElementById('formatSelect').style.display = 'block';
                } else {
                    log('解析失败: ' + (result.error || '未知错误'), 'error');
                }
            } catch (error) {
                log('网络错误: ' + error.message, 'error');
                log('详细错误信息:', 'error');
                console.error('Error:', error);

                // 尝试测试后端连接
                try {
                    const healthResponse = await fetch('/api/health');
                    log(`后端健康检查: ${healthResponse.status}`, 'info');
                } catch (healthError) {
                    log('❌ 无法连接到后端服务！请确保后端运行在 http://localhost:8000', 'error');
                }
            }
        }

        function populateFormatSelect() {
            const select = document.getElementById('formatSelect');
            select.innerHTML = '<option value="">请选择格式...</option>';

            videoData.formats.forEach((fmt, index) => {
                const option = document.createElement('option');
                option.value = fmt.format_id;
                option.textContent = fmt.label;
                option.dataset.index = index;
                select.appendChild(option);
            });
        }

        async function downloadVideo() {
            const formatSelect = document.getElementById('formatSelect');
            const selectedFormatId = formatSelect.value;

            if (!selectedFormatId) {
                log('请先选择一个格式', 'error');
                return;
            }

            const selectedOption = formatSelect.options[formatSelect.selectedIndex];
            const formatLabel = selectedOption.textContent;
            log(`开始下载... 格式: ${formatLabel}`, 'info');

            try {
                log('发送下载请求...', 'info');

                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: document.getElementById('videoUrl').value.trim(),
                        format_id: selectedFormatId
                    })
                });

                log(`下载响应状态: ${response.status}`, 'info');

                if (!response.ok) {
                    const errorText = await response.text();
                    log(`下载失败: ${response.status} - ${errorText}`, 'error');
                    return;
                }

                // 获取响应头信息
                const contentLength = response.headers.get('content-length');
                const contentType = response.headers.get('content-type');
                log(`Content-Length: ${contentLength}`, 'info');
                log(`Content-Type: ${contentType}`, 'info');

                // 获取文件名
                const contentDisposition = response.headers.get('content-disposition');
                let filename = 'video.mp4';
                if (contentDisposition) {
                    const match = contentDisposition.match(/filename\*?=(?:UTF-8'')?([^;\n]+)/i);
                    if (match) {
                        filename = decodeURIComponent(match[1].replace(/"/g, ''));
                        log(`文件名: ${filename}`, 'info');
                    }
                }

                // 读取blob数据
                log('正在读取响应数据...', 'info');
                const blob = await response.blob();
                log(`Blob大小: ${blob.size} bytes`, 'info');

                // 创建下载链接
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(downloadUrl);

                log('✅ 下载成功！文件已开始下载', 'success');

                // 检查下载是否真的开始
                setTimeout(() => {
                    log('提示：如果没有看到浏览器下载提示，请检查浏览器下载列表', 'info');
                }, 1000);

            } catch (error) {
                log('❌ 下载失败: ' + error.message, 'error');
                console.error('Download Error:', error);
            }
        }

        // 页面加载时测试后端连接
        window.onload = function() {
            log('页面加载完成，测试后端连接...', 'info');
            fetch('/api/health')
                .then(response => {
                    if (response.ok) {
                        log('✅ 后端服务连接正常', 'success');
                    } else {
                        log(`❌ 后端服务返回异常状态: ${response.status}`, 'error');
                    }
                })
                .catch(error => {
                    log('❌ 无法连接到后端服务！', 'error');
                    log('错误信息: ' + error.message, 'error');
                    log('请确保后端服务正在运行在 http://localhost:8000', 'warning');
                });
        };
    </script>
</body>
</html>
