<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直接下载测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .download-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 12px 24px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        button:hover {
            background: #218838;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }
        .error {
            color: #dc3545;
        }
        .success {
            color: #28a745;
        }
        .info {
            color: #17a2b8;
        }
        .warning {
            color: #ffc107;
        }
        .progress {
            margin-top: 10px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 直接下载测试</h1>
        <p style="margin-bottom: 20px; color: #666;">
            这个页面直接测试下载功能，不经过前端框架，帮助定位问题。
        </p>

        <div class="download-form">
            <div>
                <label>视频URL：</label>
                <input type="text" id="videoUrl"
                       value="https://www.bilibili.com/video/BV1jUgA6YEw6/?spm_id_from=333.1387.upload.video_card.click&vd_source=c560d6ba0469a144a9cdcc0bfd06c011"
                       style="width: 100%; margin-bottom: 10px;">
            </div>

            <div>
                <label>格式ID：</label>
                <select id="formatId" style="width: 100%; padding: 10px; margin-bottom: 10px;">
                    <option value="64">720p MP4 (推荐)</option>
                    <option value="32">480p MP4</option>
                    <option value="16">360p MP4</option>
                    <option value="best">最佳自动选择</option>
                </select>
            </div>

            <button id="downloadBtn" onclick="downloadVideo()">🚀 开始下载</button>
        </div>

        <div id="progress" class="progress">
            <p>下载进度处理中...</p>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script>
        let currentDownload = null;

        function log(message, type = 'info') {
            const status = document.getElementById('status');
            const timestamp = new Date().toLocaleTimeString();
            status.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            status.scrollTop = status.scrollHeight;
        }

        async function downloadVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            const formatId = document.getElementById('formatId').value;
            const downloadBtn = document.getElementById('downloadBtn');
            const progress = document.getElementById('progress');

            if (!url) {
                log('❌ 请输入视频URL', 'error');
                return;
            }

            downloadBtn.disabled = true;
            progress.style.display = 'block';
            document.getElementById('status').innerHTML = '';

            log('🚀 开始下载...', 'info');
            log(`URL: ${url}`, 'info');
            log(`Format ID: ${formatId}`, 'info');

            try {
                // 显示进度
                progress.innerHTML = '<p>📡 正在发送下载请求...</p>';

                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        format_id: formatId
                    })
                });

                log(`📡 响应状态: ${response.status}`, 'info');

                if (!response.ok) {
                    const errorText = await response.text();
                    log(`❌ HTTP错误: ${response.status}`, 'error');
                    log(`错误详情: ${errorText}`, 'error');
                    return;
                }

                // 获取响应头信息
                const contentType = response.headers.get('content-type');
                const contentLength = response.headers.get('content-length');
                const contentDisposition = response.headers.get('content-disposition');

                log(`✅ 响应正常`, 'success');
                log(`Content-Type: ${contentType}`, 'info');
                log(`Content-Length: ${contentLength}`, 'info');
                log(`Content-Disposition: ${contentDisposition}`, 'info');

                // 解析文件名
                let filename = 'video.mp4';
                if (contentDisposition) {
                    const patterns = [
                        /filename\*?=(?:UTF-8'')?([^;\n]+)/i,
                        /filename="?([^"]+)"?/i,
                        /filename=([^;]+)/i
                    ];

                    for (const pattern of patterns) {
                        const match = contentDisposition.match(pattern);
                        if (match) {
                            filename = decodeURIComponent(match[1].replace(/"/g, ''));
                            break;
                        }
                    }
                }

                log(`📁 文件名: ${filename}`, 'info');

                progress.innerHTML = '<p>📦 正在处理文件数据...</p>';

                // 读取blob
                const blob = await response.blob();
                log(`📦 Blob大小: ${blob.size} bytes`, 'success');

                progress.innerHTML = '<p>🎯 准备下载...</p>';

                // 创建下载链接
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;

                // 设置不同的触发方式
                const triggers = [
                    () => {
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    },
                    () => {
                        a.target = '_blank';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    },
                    () => {
                        window.open(downloadUrl, '_blank');
                    }
                ];

                // 尝试不同的触发方式
                let success = false;
                for (let i = 0; i < triggers.length; i++) {
                    try {
                        log(`尝试触发方式 ${i + 1}...`, 'info');
                        triggers[i]();
                        success = true;
                        log(`✅ 触发方式 ${i + 1} 成功`, 'success');
                        break;
                    } catch (e) {
                        log(`❌ 触发方式 ${i + 1} 失败: ${e.message}`, 'error');
                    }
                }

                // 延迟释放URL
                setTimeout(() => {
                    window.URL.revokeObjectURL(downloadUrl);
                    progress.style.display = 'none';
                    downloadBtn.disabled = false;

                    if (success) {
                        log('🎉 下载流程完成！请检查浏览器下载列表。', 'success');
                    } else {
                        log('❌ 所有触发方式都失败了，请尝试其他浏览器或检查设置。', 'error');
                    }
                }, 2000);

            } catch (error) {
                log(`❌ 下载失败: ${error.message}`, 'error');
                console.error('Download Error:', error);
                progress.style.display = 'none';
                downloadBtn.disabled = false;
            }
        }

        // 页面加载时测试连接
        window.onload = function() {
            log('页面加载完成，测试后端连接...', 'info');
            fetch('/api/health')
                .then(response => response.json())
                .then(data => {
                    log(`✅ 后端连接正常: ${data.message}`, 'success');
                })
                .catch(error => {
                    log(`❌ 后端连接失败: ${error.message}`, 'error');
                });
        };
    </script>
</body>
</html>
